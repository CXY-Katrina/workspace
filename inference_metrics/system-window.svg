<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="QPS、TPS 与并发的统计范围" style="font-family:Segoe UI,Microsoft YaHei,sans-serif"><title>QPS、TPS 与并发的统计范围</title><rect width="1200" height="540" fill="#ffffff"/><text x="36" y="40" font-size="25" fill="#1d3045" text-anchor="start" font-weight="650">多条请求：吞吐看整段窗口，并发看某一时刻</text><text x="36" y="70" font-size="16" fill="#63768a" text-anchor="start" font-weight="400">演示窗口 W = [0, 10) 秒；4 个成功请求，14 个输出 token；无失败、无跨窗口请求。</text><g class="measure" data-metric=""><line x1="150" y1="111" x2="1050" y2="111" stroke="#2865b5" stroke-width="3" stroke-dasharray=""/><line x1="150" y1="104" x2="150" y2="118" stroke="#2865b5" stroke-width="3" stroke-dasharray=""/><line x1="1050" y1="104" x2="1050" y2="118" stroke="#2865b5" stroke-width="3" stroke-dasharray=""/><text x="600.0" y="99" font-size="18" fill="#2865b5" text-anchor="middle" font-weight="600">W = 10 s：QPS 与系统 TPS 共用的墙钟窗口</text></g><line x1="150" y1="140" x2="150" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="150" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">0s</text><line x1="240" y1="140" x2="240" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="240" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">1s</text><line x1="330" y1="140" x2="330" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="330" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">2s</text><line x1="420" y1="140" x2="420" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="420" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">3s</text><line x1="510" y1="140" x2="510" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="510" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">4s</text><line x1="600" y1="140" x2="600" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="600" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">5s</text><line x1="690" y1="140" x2="690" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="690" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">6s</text><line x1="780" y1="140" x2="780" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="780" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">7s</text><line x1="870" y1="140" x2="870" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="870" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">8s</text><line x1="960" y1="140" x2="960" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="960" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">9s</text><line x1="1050" y1="140" x2="1050" y2="407" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 5"/><text x="1050" y="435" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">10s</text><text x="50" y="178" font-size="18" fill="#1d3045" text-anchor="start" font-weight="600">请求 A</text><rect x="150" y="155" width="45.0" height="32" rx="4" fill="#dce4ec" opacity="1"/><rect x="195.0" y="155" width="135.0" height="32" rx="4" fill="#087f8c" opacity="1"/><rect x="330" y="155" width="180" height="32" rx="4" fill="#7352bd" opacity="1"/><circle cx="330" cy="171" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><circle cx="420" cy="171" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><circle cx="510" cy="171" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><text x="524" y="177" font-size="15" fill="#63768a" text-anchor="start" font-weight="400">✓ 3 tokens</text><text x="50" y="242" font-size="18" fill="#1d3045" text-anchor="start" font-weight="600">请求 B</text><rect x="240" y="219" width="45.0" height="32" rx="4" fill="#dce4ec" opacity="1"/><rect x="285.0" y="219" width="135.0" height="32" rx="4" fill="#087f8c" opacity="1"/><rect x="420" y="219" width="270" height="32" rx="4" fill="#7352bd" opacity="1"/><circle cx="420" cy="235" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><circle cx="510" cy="235" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><circle cx="600" cy="235" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><circle cx="690" cy="235" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><text x="704" y="241" font-size="15" fill="#63768a" text-anchor="start" font-weight="400">✓ 4 tokens</text><text x="50" y="306" font-size="18" fill="#1d3045" text-anchor="start" font-weight="600">请求 C</text><rect x="330" y="283" width="45.0" height="32" rx="4" fill="#dce4ec" opacity="1"/><rect x="375.0" y="283" width="225.0" height="32" rx="4" fill="#087f8c" opacity="1"/><rect x="600" y="283" width="270" height="32" rx="4" fill="#7352bd" opacity="1"/><circle cx="600" cy="299" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><circle cx="690" cy="299" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><circle cx="780" cy="299" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><circle cx="870" cy="299" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><text x="884" y="305" font-size="15" fill="#63768a" text-anchor="start" font-weight="400">✓ 4 tokens</text><text x="50" y="370" font-size="18" fill="#1d3045" text-anchor="start" font-weight="600">请求 D</text><rect x="690" y="347" width="45.0" height="32" rx="4" fill="#dce4ec" opacity="1"/><rect x="735.0" y="347" width="45.0" height="32" rx="4" fill="#087f8c" opacity="1"/><rect x="780" y="347" width="180" height="32" rx="4" fill="#7352bd" opacity="1"/><circle cx="780" cy="363" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><circle cx="870" cy="363" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><circle cx="960" cy="363" r="6" fill="#ffffff" stroke="#7352bd" stroke-width="2"/><text x="974" y="369" font-size="15" fill="#63768a" text-anchor="start" font-weight="400">✓ 3 tokens</text><g id="cursor" transform="translate(465 0)"><line x1="0" y1="133" x2="0" y2="408" stroke="#b36a0c" stroke-width="3" stroke-dasharray="6 4"/><text x="10" y="148" font-size="16" fill="#b36a0c" text-anchor="start" font-weight="650">t = 3.5 s</text></g><text x="36" y="477" font-size="16" fill="#63768a" text-anchor="start" font-weight="400">● 白点 = 输出 token（含首 token）    ✓ = 请求完成    灰 = 接入/排队    青 = Prefill 至首 token    紫 = 后续输出</text><text x="36" y="512" font-size="17" fill="#1d3045" text-anchor="start" font-weight="600">在 t = 3.5 s：A、B 正在输出，C 仍在 Prefill；在途并发 C(t) = 3，但 Decode 中的请求只有 2 条。</text></svg>