<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-label="TTFT、ITL、TPOT 与 E2E 的测量范围" style="font-family:Segoe UI,Microsoft YaHei,sans-serif"><title>TTFT、ITL、TPOT 与 E2E 的测量范围</title><rect width="1200" height="530" fill="#ffffff"/><text x="36" y="40" font-size="25" fill="#1d3045" text-anchor="start" font-weight="650">一条请求：先等首 token，再看后续输出节奏</text><text x="36" y="70" font-size="16" fill="#63768a" text-anchor="start" font-weight="400">示例：客户端时间戳，单位 ms；N = 5。每次流式输出恰好含 1 个 token。</text><text x="36" y="133" font-size="17" fill="#63768a" text-anchor="start" font-weight="400">流程</text><rect x="150" y="94" width="100" height="68" rx="8" fill="#dce4ec" opacity="1"/><text x="200.0" y="122" font-size="14" fill="#1d3045" text-anchor="middle" font-weight="600">接入 / 排队</text><text x="200.0" y="145" font-size="13" fill="#63768a" text-anchor="middle" font-weight="400">0–100</text><rect x="250" y="94" width="300" height="68" rx="8" fill="#087f8c" opacity="1"/><text x="400.0" y="122" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Prefill：读输入，建立 KV</text><text x="400.0" y="145" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400">100–400</text><rect x="550" y="94" width="100" height="68" rx="8" fill="#dce4ec" opacity="1"/><text x="600.0" y="122" font-size="14" fill="#1d3045" text-anchor="middle" font-weight="600">首包返回</text><text x="600.0" y="145" font-size="13" fill="#63768a" text-anchor="middle" font-weight="400">400–500</text><rect x="650" y="94" width="300" height="68" rx="8" fill="#7352bd" opacity="1"/><text x="800.0" y="122" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">后续 Decode / 调度 / 返回</text><text x="800.0" y="145" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400">首 token 之后</text><text x="976" y="125" font-size="15" fill="#63768a" text-anchor="start" font-weight="400">收尾</text><text x="976" y="149" font-size="14" fill="#63768a" text-anchor="start" font-weight="400">20 ms</text><line x1="150" y1="202" x2="1060" y2="202" stroke="#1d3045" stroke-width="2" stroke-dasharray=""/><line x1="150" y1="164" x2="150" y2="217" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 4"/><circle cx="150" cy="202" r="6" fill="#1d3045"/><text x="150" y="237" font-size="16" fill="#1d3045" text-anchor="middle" font-weight="600">t₀</text><text x="150" y="257" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">0</text><line x1="650" y1="164" x2="650" y2="217" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 4"/><circle cx="650" cy="202" r="6" fill="#1d3045"/><text x="650" y="237" font-size="16" fill="#1d3045" text-anchor="middle" font-weight="600">t₁</text><text x="650" y="257" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">500</text><line x1="700" y1="164" x2="700" y2="260" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 4"/><circle cx="700" cy="202" r="6" fill="#1d3045"/><text x="700" y="280" font-size="16" fill="#1d3045" text-anchor="middle" font-weight="600">t₂</text><text x="700" y="300" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">550</text><line x1="800" y1="164" x2="800" y2="217" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 4"/><circle cx="800" cy="202" r="6" fill="#1d3045"/><text x="800" y="237" font-size="16" fill="#1d3045" text-anchor="middle" font-weight="600">t₃</text><text x="800" y="257" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">650</text><line x1="850" y1="164" x2="850" y2="260" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 4"/><circle cx="850" cy="202" r="6" fill="#1d3045"/><text x="850" y="280" font-size="16" fill="#1d3045" text-anchor="middle" font-weight="600">t₄</text><text x="850" y="300" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">700</text><line x1="950" y1="164" x2="950" y2="217" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 4"/><circle cx="950" cy="202" r="6" fill="#1d3045"/><text x="950" y="237" font-size="16" fill="#1d3045" text-anchor="middle" font-weight="600">t₅</text><text x="950" y="257" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">800</text><line x1="970" y1="164" x2="970" y2="260" stroke="#d9e2eb" stroke-width="1" stroke-dasharray="4 4"/><circle cx="970" cy="202" r="6" fill="#1d3045"/><text x="970" y="280" font-size="16" fill="#1d3045" text-anchor="middle" font-weight="600">t_end</text><text x="970" y="300" font-size="15" fill="#63768a" text-anchor="middle" font-weight="400">820</text><text x="1080" y="207" font-size="16" fill="#63768a" text-anchor="start" font-weight="400">时间 →</text><g class="measure" data-metric="ttft"><line x1="150" y1="326" x2="650" y2="326" stroke="#087f8c" stroke-width="3" stroke-dasharray=""/><line x1="150" y1="319" x2="150" y2="333" stroke="#087f8c" stroke-width="3" stroke-dasharray=""/><line x1="650" y1="319" x2="650" y2="333" stroke="#087f8c" stroke-width="3" stroke-dasharray=""/><text x="400.0" y="314" font-size="18" fill="#087f8c" text-anchor="middle" font-weight="600">TTFT = 500 ms</text></g><g class="measure" data-metric="itl"><line x1="650" y1="326" x2="700" y2="326" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><line x1="650" y1="319" x2="650" y2="333" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><line x1="700" y1="319" x2="700" y2="333" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><text x="675.0" y="314" font-size="18" fill="#7352bd" text-anchor="middle" font-weight="600">50</text></g><g class="measure" data-metric="itl"><line x1="700" y1="326" x2="800" y2="326" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><line x1="700" y1="319" x2="700" y2="333" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><line x1="800" y1="319" x2="800" y2="333" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><text x="750.0" y="314" font-size="18" fill="#7352bd" text-anchor="middle" font-weight="600">100</text></g><g class="measure" data-metric="itl"><line x1="800" y1="326" x2="850" y2="326" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><line x1="800" y1="319" x2="800" y2="333" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><line x1="850" y1="319" x2="850" y2="333" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><text x="825.0" y="314" font-size="18" fill="#7352bd" text-anchor="middle" font-weight="600">50</text></g><g class="measure" data-metric="itl"><line x1="850" y1="326" x2="950" y2="326" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><line x1="850" y1="319" x2="850" y2="333" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><line x1="950" y1="319" x2="950" y2="333" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><text x="900.0" y="314" font-size="18" fill="#7352bd" text-anchor="middle" font-weight="600">100</text></g><text x="976" y="331" font-size="16" fill="#7352bd" text-anchor="start" font-weight="400">ITL：逐次间隔</text><g class="measure" data-metric="tpot"><line x1="650" y1="380" x2="950" y2="380" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><line x1="650" y1="373" x2="650" y2="387" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><line x1="950" y1="373" x2="950" y2="387" stroke="#7352bd" stroke-width="3" stroke-dasharray=""/><text x="800.0" y="368" font-size="18" fill="#7352bd" text-anchor="middle" font-weight="600">TPOT = 300 ÷ 4 = 75 ms/token</text></g><g class="measure" data-metric="e2e"><line x1="150" y1="430" x2="970" y2="430" stroke="#2865b5" stroke-width="3" stroke-dasharray=""/><line x1="150" y1="423" x2="150" y2="437" stroke="#2865b5" stroke-width="3" stroke-dasharray=""/><line x1="970" y1="423" x2="970" y2="437" stroke="#2865b5" stroke-width="3" stroke-dasharray=""/><text x="560.0" y="418" font-size="18" fill="#2865b5" text-anchor="middle" font-weight="600">E2E = 820 ms = TTFT 500 + 后续输出 300 + 收尾 20</text></g><text x="36" y="478" font-size="17" fill="#1d3045" text-anchor="start" font-weight="400">Prefill 通常产生首 token 的 logits，再采样首 token；常规 Decode 利用 KV cache 逐步生成后续 token。</text><text x="36" y="505" font-size="15" fill="#63768a" text-anchor="start" font-weight="400">上方阶段按客户端观测简化展开；真实服务器的 Decode 可与首包传输重叠。间隔含等待、调度和通信，非纯 GPU 时间。</text></svg>